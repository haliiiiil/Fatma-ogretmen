<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Harf Adası 🏝️ – Fatma Nur Öğretmen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#87CEEB;--sea:#4FC3F7;--sand:#F4D03F;--grass:#5DBB63;
  --orange:#FF6B35;--purple:#A855F7;--pink:#EC4899;--green:#22C55E;
  --blue:#3B82F6;--yellow:#F59E0B;--red:#EF4444;--teal:#14B8A6;
  --text:#1E1B18;--muted:#6B6560;--white:#FFFDF9;
}
body{font-family:'Nunito',sans-serif;background:var(--sky);color:var(--text);overflow-x:hidden;min-height:100vh;user-select:none}

/* NAV */
nav{background:var(--orange);height:50px;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:200}
.nav-title{font-family:'Baloo 2',cursive;font-size:16px;font-weight:900;color:#fff;flex:1}
.nav-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer}
.nav-btn:hover{background:rgba(255,255,255,.35)}
.stars-nav{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:900;color:#FFD700}

/* SCREENS */
.screen{display:none;animation:fadeUp .35s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── INTRO ── */
.intro-wrap{max-width:440px;margin:0 auto;padding:24px 16px 40px}
.island-hero{text-align:center;padding:28px 20px 20px;background:linear-gradient(180deg,#87CEEB 0%,#B8E4F9 60%,#F4D03F 100%);border-radius:24px;margin-bottom:20px;position:relative;overflow:hidden}
.island-title{font-family:'Baloo 2',cursive;font-size:34px;font-weight:900;color:#1E1B18;text-shadow:0 2px 0 rgba(255,255,255,.6);margin-bottom:6px}
.island-sub{font-size:14px;color:#374151;font-weight:700;margin-bottom:16px}
.island-img{font-size:72px;margin-bottom:8px;display:block;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.intro-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;border:2px solid rgba(0,0,0,.08)}
.intro-card h3{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;margin-bottom:10px;color:var(--orange)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select{width:100%;padding:10px 13px;border:2px solid rgba(0,0,0,.1);border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;outline:none;background:#FFFDF9;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--orange)}
.err{font-size:12px;color:#dc2626;font-weight:700;margin-top:4px;display:none}
.start-btn{width:100%;padding:16px;background:var(--orange);color:#fff;border:none;border-radius:14px;font-family:'Baloo 2',cursive;font-size:20px;font-weight:900;cursor:pointer;transition:transform .15s,opacity .2s;letter-spacing:.02em}
.start-btn:hover{opacity:.9;transform:translateY(-2px)}
.sb-link{text-align:center;margin-top:12px}
.sb-link button{background:none;border:none;color:var(--orange);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;text-decoration:underline}

/* ── HARITA ── */
.map-wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.map-header{text-align:center;margin-bottom:16px}
.map-header h2{font-family:'Baloo 2',cursive;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.map-header p{font-size:13px;color:rgba(255,255,255,.9);font-weight:700}
.map-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.letter-btn{aspect-ratio:1;border-radius:12px;border:none;font-family:'Baloo 2',cursive;font-size:18px;font-weight:900;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.letter-btn:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.letter-btn.locked{background:#B4B2A9;color:#888780;cursor:not-allowed}
.letter-btn.locked:hover{transform:none;box-shadow:none}
.letter-btn.done{background:#22C55E;color:#fff}
.letter-btn.active-letter{background:var(--orange);color:#fff;box-shadow:0 0 0 3px #fff}
.letter-btn.partial{background:var(--yellow);color:#fff}
.letter-mini{font-size:9px;font-weight:700;opacity:.8}
.stars-on-btn{position:absolute;top:3px;right:3px;font-size:9px}

/* ── OYUN SAHNE ── */
.game-wrap{max-width:480px;margin:0 auto;padding:12px 16px 40px}
.game-header{background:rgba(255,255,255,.9);border-radius:16px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.letter-badge{font-family:'Baloo 2',cursive;font-size:36px;font-weight:900;line-height:1;color:var(--orange)}
.letter-badge small{font-size:18px;color:var(--muted)}
.game-info{flex:1}
.game-info h3{font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;color:var(--text)}
.game-info p{font-size:12px;color:var(--muted);font-weight:700}
.stage-dots{display:flex;gap:5px;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.15);transition:background .3s}
.dot.done{background:var(--green)}
.dot.active{background:var(--orange)}

/* ── INTRO STAGE ── */
.stage-intro{background:#fff;border-radius:20px;padding:28px 20px;text-align:center}
.big-letter{font-family:'Baloo 2',cursive;font-size:110px;font-weight:900;line-height:1;color:var(--orange);cursor:pointer;transition:transform .15s;display:inline-block}
.big-letter:hover{transform:scale(1.06)}
.big-letter.bounce{animation:letterBounce .5s ease}
@keyframes letterBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.2) rotate(-5deg)}70%{transform:scale(.95)}}
.letter-small{font-family:'Baloo 2',cursive;font-size:60px;font-weight:900;color:var(--blue);margin-left:20px}
.intro-word{font-size:18px;font-weight:800;margin-top:14px;color:var(--text)}
.intro-word span{color:var(--orange)}
.intro-word .word-emoji{font-size:32px;display:block;margin-top:6px}
.speak-btn{margin-top:16px;background:var(--orange);color:#fff;border:none;border-radius:20px;padding:10px 24px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s}
.speak-btn:hover{transform:scale(1.05)}
.next-stage-btn{margin-top:18px;display:block;width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:14px;font-family:'Baloo 2',cursive;font-size:18px;font-weight:900;cursor:pointer;transition:transform .15s,opacity .2s}
.next-stage-btn:hover{transform:translateY(-2px);opacity:.9}

/* ── SES AVI ── */
.sesavi-wrap{background:#fff;border-radius:20px;padding:20px}
.sesavi-q{font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;color:var(--text);text-align:center;margin-bottom:4px}
.sesavi-hint{font-size:12px;color:var(--muted);text-align:center;font-weight:700;margin-bottom:16px}
.sesavi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sesavi-item{border-radius:14px;border:2px solid rgba(0,0,0,.1);background:#FAFAF8;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.sesavi-item:hover{transform:scale(1.04);border-color:var(--orange)}
.sesavi-item .item-emoji{font-size:40px}
.sesavi-item .item-word{font-size:13px;font-weight:800;color:var(--text)}
.sesavi-item.correct{background:#DCFCE7;border-color:var(--green);animation:correctPop .4s ease}
.sesavi-item.wrong{background:#FEE2E2;border-color:var(--red);animation:wrongShake .4s ease}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sesavi-score{text-align:center;font-size:13px;font-weight:800;color:var(--muted);margin-top:10px}

/* ── BALON PATLA ── */
.balon-wrap{background:linear-gradient(180deg,#87CEEB,#B8E4F9);border-radius:20px;padding:16px;min-height:320px;position:relative;overflow:hidden}
.balon-q{font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;color:#fff;text-align:center;margin-bottom:8px;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.balon-timer{text-align:center;font-size:12px;font-weight:800;color:rgba(255,255,255,.85);margin-bottom:10px}
.balon-field{position:relative;height:260px;overflow:hidden}
.balon{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:20px;font-weight:900;color:#fff;cursor:pointer;transition:transform .1s;animation:riseUp linear forwards}
.balon:hover{transform:scale(1.12)}
@keyframes riseUp{from{bottom:-60px;opacity:1}to{bottom:110%;opacity:.4}}
.balon.pop{animation:popAnim .3s ease forwards}
@keyframes popAnim{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.7}100%{transform:scale(0);opacity:0}}
.balon-score{text-align:center;font-size:13px;font-weight:800;color:#fff;margin-top:8px}

/* ── HAF ÇİZ ── */
.ciz-wrap{background:#fff;border-radius:20px;padding:16px}
.ciz-q{font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;text-align:center;color:var(--text);margin-bottom:12px}
.canvas-wrap{position:relative;border-radius:14px;overflow:hidden;background:#FAFAF8;border:2px dashed rgba(0,0,0,.15);margin-bottom:12px}
#drawCanvas{display:block;width:100%;touch-action:none}
.ciz-guide{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:.18}
.ciz-btns{display:flex;gap:8px}
.ciz-btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
.ciz-clear{background:#FEF3C7;color:#92400E}
.ciz-check{background:var(--green);color:#fff}
.ciz-feedback{text-align:center;font-size:14px;font-weight:800;margin-top:10px;min-height:22px}

/* ── SONUÇ ── */
.result-wrap{background:#fff;border-radius:20px;padding:28px 20px;text-align:center}
.result-stars{font-size:40px;margin-bottom:10px;letter-spacing:4px}
.result-title{font-family:'Baloo 2',cursive;font-size:26px;font-weight:900;color:var(--orange);margin-bottom:6px}
.result-sub{font-size:14px;color:var(--muted);margin-bottom:20px}
.result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rbtn{padding:12px 20px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:transform .15s,opacity .2s}
.rbtn:hover{transform:translateY(-2px);opacity:.9}
.rbtn-next{background:var(--orange);color:#fff}
.rbtn-map{background:var(--blue);color:#fff}
.rbtn-retry{background:#F1EFE8;color:var(--muted)}

/* ── SKORBORD ── */
.sb-wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.sb-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:12px}
.sb-card h2{font-family:'Baloo 2',cursive;font-size:20px;font-weight:900;color:var(--orange);margin-bottom:14px}
.sb-list{display:flex;flex-direction:column;gap:8px}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#FAFAF8;border:1.5px solid rgba(0,0,0,.08)}
.sb-rank{font-family:'Baloo 2',cursive;font-size:20px;font-weight:900;min-width:30px;text-align:center}
.sb-info{flex:1}
.sb-name{font-size:14px;font-weight:800}
.sb-meta{font-size:11px;color:var(--muted)}
.sb-pts{font-family:'Baloo 2',cursive;font-size:20px;font-weight:900;color:var(--orange)}
.sb-stars{font-size:12px}
.sb-empty{text-align:center;padding:30px;color:var(--muted);font-size:14px}
.back-btn{display:block;width:100%;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-family:'Baloo 2',cursive;font-size:17px;font-weight:900;cursor:pointer;margin-bottom:12px}
.clear-btn{display:block;width:100%;padding:10px;background:none;border:2px solid #EF4444;color:#EF4444;border-radius:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer}

/* ── CONFETTI ── */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ── TOAST ── */
.toast-el{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#1E1B18;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast-el.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── CHAR POPUP ── */
.char-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fff;border-radius:24px;padding:28px 32px;text-align:center;z-index:500;border:3px solid var(--orange);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.char-popup.show{transform:translate(-50%,-50%) scale(1)}
.char-popup .pop-letter{font-family:'Baloo 2',cursive;font-size:80px;font-weight:900;color:var(--orange);line-height:1}
.char-popup .pop-msg{font-size:16px;font-weight:800;margin-top:8px;color:var(--text)}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:499;display:none}
</style>
</head>
<body>

<nav>
  <span class="nav-title">🏝️ Harf Adası</span>
  <div class="stars-nav">⭐ <span id="total-stars">0</span></div>
  <button class="nav-btn" onclick="showSB()">🏆</button>
  <button class="nav-btn" onclick="goHome()">← Ana Sayfa</button>
</nav>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="intro-wrap">
    <div class="island-hero">
      <span class="island-img">🏝️</span>
      <div class="island-title">Harf Adası</div>
      <div class="island-sub">Harfleri kurtarıp ada hazinesini bul!</div>
    </div>
    <div class="intro-card">
      <h3>🧒 Kaşif Bilgileri</h3>
      <div class="form-group">
        <label>Adın Soyadın <span style="color:var(--orange)">*</span></label>
        <input type="text" id="inp-name" placeholder="Örn: Ali Yılmaz" autocomplete="off">
        <div class="err" id="err-name">Lütfen adını yaz!</div>
      </div>
      <div class="form-group">
        <label>Sınıf</label>
        <select id="inp-grade">
          <option value="">Seçiniz...</option>
          <option>1. Sınıf</option><option>2. Sınıf</option>
          <option>3. Sınıf</option><option>4. Sınıf</option>
          <option>Öğretmen / Veli</option>
        </select>
      </div>
    </div>
    <button class="start-btn" onclick="startAdventure()">🚀 Maceraya Başla!</button>
    <div class="sb-link"><button onclick="showSB()">🏆 Kaşifler Tablosu</button></div>
  </div>
</div>

<!-- HARİTA -->
<div id="screen-map" class="screen">
  <div class="map-wrap">
    <div class="map-header">
      <h2>🗺️ Harf Haritası</h2>
      <p id="map-sub">Bir harf seç ve maceraya atıl!</p>
    </div>
    <div class="map-grid" id="map-grid"></div>
  </div>
</div>

<!-- OYUN -->
<div id="screen-game" class="screen">
  <div class="game-wrap">
    <div class="game-header">
      <div class="letter-badge" id="gh-badge">A <small>a</small></div>
      <div class="game-info">
        <h3 id="gh-title">Görev 1 — Harfi Tanı</h3>
        <p id="gh-sub">A harfini öğren</p>
        <div class="stage-dots" id="stage-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div id="stage-area"></div>
  </div>
</div>

<!-- SKORBORD -->
<div id="screen-sb" class="screen">
  <div class="sb-wrap">
    <button class="back-btn" onclick="showMap()">← Haritaya Dön</button>
    <div class="sb-card">
      <h2>🏆 Kaşifler Tablosu</h2>
      <div id="sb-list"></div>
    </div>
    <button class="clear-btn" onclick="clearSB()">🗑️ Tabloyu Sıfırla</button>
  </div>
</div>

<div class="popup-overlay" id="popup-overlay" onclick="closePopup()"></div>
<div class="char-popup" id="char-popup">
  <div class="pop-letter" id="pop-letter">A</div>
  <div class="pop-msg" id="pop-msg">Harika!</div>
</div>
<div class="toast-el" id="toast"></div>

<script>
// ── VERİ ──
var LETTERS = ['A','B','C','Ç','D','E','F','G','Ğ','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];

var WORDS = {
  'A':['Arı','Araba','Ayı','At'],
  'B':['Balon','Bebek','Balık','Bardak'],
  'C':['Cep','Cam','Ceket','Ceviz'],
  'Ç':['Çiçek','Çanta','Çorap','Çay'],
  'D':['Dağ','Deniz','Deve','Diş'],
  'E':['Elma','Ev','Eşek','Erik'],
  'F':['Fare','Fener','Fincan','Fıstık'],
  'G':['Göz','Gül','Gemi','Güneş'],
  'Ğ':['Ğıldır','Yağ','Dağ','Bağ'],
  'H':['Horoz','Halı','Hamsi','Hap'],
  'I':['Işık','Isırgan','Isı','Irak'],
  'İ':['İnek','İpek','İncir','İğne'],
  'J':['Jilet','Jeton','Jale','Jandarma'],
  'K':['Kedi','Kalem','Karpuz','Kuzu'],
  'L':['Lale','Limon','Levye','Lastik'],
  'M':['Mavi','Masa','Muz','Makas'],
  'N':['Nar','Nohut','Ninni','Nokta'],
  'O':['Okul','Orman','Otobüs','Oyun'],
  'Ö':['Ördek','Öpücük','Ökse','Öfke'],
  'P':['Panda','Portakal','Pasta','Pil'],
  'R':['Rüzgar','Radyo','Renk','Robot'],
  'S':['Saat','Su','Sarı','Sandık'],
  'Ş':['Şeker','Şapka','Şemsiye','Şeftali'],
  'T':['Tren','Tavuk','Top','Taş'],
  'U':['Uçak','Uğur böceği','Uyku','Uzay'],
  'Ü':['Üzüm','Ütü','Ülke','Üçgen'],
  'V':['Vazo','Vişne','Van kedisi','Veteriner'],
  'Y':['Yıldız','Yeşil','Yumurta','Yüz'],
  'Z':['Zürafa','Zeytin','Zil','Zıplamak']
};

var EMOJIS = {
  'A':'🐝','B':'🎈','C':'👗','Ç':'🌸','D':'⛰️','E':'🍎','F':'🐭','G':'🌹',
  'Ğ':'🏔️','H':'🐓','I':'💡','İ':'🐄','J':'🗡️','K':'🐱','L':'🌷','M':'🍌',
  'N':'🍎','O':'🏫','Ö':'🦆','P':'🐼','R':'💨','S':'⏰','Ş':'🍬','T':'🚂',
  'U':'✈️','Ü':'🍇','V':'🏺','Y':'⭐','Z':'🦒'
};

var COLORS = ['#FF6B35','#A855F7','#3B82F6','#22C55E','#F59E0B','#EC4899','#14B8A6','#EF4444'];

// ── STATE ──
var player = {name:'', grade:''};
var currentLetter = 'A';
var currentStage = 0; // 0=intro,1=sesavi,2=balon,3=ciz
var letterProgress = {};
var totalStars = 0;
var stageStars = [0,0,0,0];
var STORAGE_KEY = 'harfadasi_v2';

// ses
var AudioCtx = null;
function getAudio(){if(!AudioCtx) AudioCtx = new (window.AudioContext||window.webkitAudioContext)();return AudioCtx;}

function playTone(freq, dur, type){
  try{
    var a=getAudio(), o=a.createOscillator(), g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.frequency.value=freq;o.type=type||'sine';
    g.gain.setValueAtTime(.3,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}

function playSuccess(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.18,'sine'),i*90));
}
function playWrong(){
  [300,250].forEach((f,i)=>setTimeout(()=>playTone(f,.15,'sawtooth'),i*120));
}
function playCoin(){
  [880,1100].forEach((f,i)=>setTimeout(()=>playTone(f,.1,'square'),i*80));
}
function playWin(){
  [523,659,784,880,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.2,'sine'),i*100));
  setTimeout(()=>{[1047,880,784,659,523,392].forEach((f,i)=>setTimeout(()=>playTone(f,.15,'sine'),i*80));},600);
}
function playLetter(letter){
  var freqs={'A':440,'B':494,'C':523,'Ç':554,'D':587,'E':622,'F':659,'G':698,'Ğ':740,'H':784,'I':831,'İ':880,'J':932,'K':988,'L':1047,'M':1109,'N':1175,'O':1245,'Ö':1319,'P':1397,'R':1480,'S':1568,'Ş':1661,'T':1760,'U':1865,'Ü':1976,'V':2093,'Y':2217,'Z':2349};
  var f=freqs[letter]||440;
  playTone(f,.08,'sine');
  setTimeout(()=>playTone(f*1.25,.06,'sine'),100);
}

// ── UTILS ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function confetti(){
  for(var i=0;i<30;i++){
    var el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText='left:'+Math.random()*100+'vw;top:0;background:'+COLORS[Math.floor(Math.random()*COLORS.length)]+';animation-duration:'+(1.5+Math.random()*2)+'s;animation-delay:'+Math.random()*.5+'s;width:'+(8+Math.random()*8)+'px;height:'+(8+Math.random()*8)+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+'';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

function showPopup(letter, msg){
  document.getElementById('pop-letter').textContent=letter;
  document.getElementById('pop-msg').textContent=msg;
  document.getElementById('char-popup').classList.add('show');
  document.getElementById('popup-overlay').style.display='block';
}

function closePopup(){
  document.getElementById('char-popup').classList.remove('show');
  document.getElementById('popup-overlay').style.display='none';
}

function goHome(){window.location.href='index.html';}

// ── BAŞLA ──
function startAdventure(){
  var name=document.getElementById('inp-name').value.trim();
  document.getElementById('err-name').style.display='none';
  if(!name){document.getElementById('err-name').style.display='block';return;}
  player.name=name;
  player.grade=document.getElementById('inp-grade').value||'';
  var saved=getSaved();
  if(saved&&saved.name===name){
    letterProgress=saved.progress||{};
    totalStars=saved.stars||0;
  } else {
    letterProgress={};totalStars=0;
  }
  document.getElementById('total-stars').textContent=totalStars;
  showMap();
}

function showMap(){
  buildMap();
  document.getElementById('map-sub').textContent=player.name+' — Harf haritası';
  showScreen('screen-map');
}

function buildMap(){
  var g=document.getElementById('map-grid');
  g.innerHTML='';
  LETTERS.forEach(function(l,i){
    var btn=document.createElement('button');
    btn.className='letter-btn';
    var p=letterProgress[l]||{stars:0,done:false};
    var col=COLORS[i%COLORS.length];
    if(p.done){btn.classList.add('done');btn.style.background=col;}
    else if(p.stars>0){btn.classList.add('partial');btn.style.background=col;btn.style.opacity='.75';}
    else{btn.style.background=col+'CC';}
    btn.innerHTML=l+'<span class="letter-mini">'+l.toLowerCase()+'</span>'+(p.stars?'<span class="stars-on-btn">'+'⭐'.repeat(p.stars)+'</span>':'');
    btn.style.color='#fff';
    btn.onclick=function(){startLetter(l);};
    g.appendChild(btn);
  });
}

// ── HARF OYUNU ──
function startLetter(l){
  currentLetter=l;
  currentStage=0;
  stageStars=[0,0,0,0];
  renderStage();
  showScreen('screen-game');
}

function renderStage(){
  var l=currentLetter;
  var dots=document.getElementById('stage-dots');
  dots.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i<currentStage?'done':i===currentStage?'active':'');
  });
  document.getElementById('gh-badge').innerHTML=l+' <small>'+l.toLowerCase()+'</small>';

  var titles=['Harfi Tanı','Ses Avı 🎵','Balon Patlat 🎈','Harf Çiz ✏️'];
  var subs=[l+' harfini tanı ve öğren','Doğru sesi bul','Sadece '+l+' balonlarını patlat',l+' harfini çiz'];
  document.getElementById('gh-title').textContent='Görev '+(currentStage+1)+' — '+titles[currentStage];
  document.getElementById('gh-sub').textContent=subs[currentStage];

  var area=document.getElementById('stage-area');
  if(currentStage===0) area.innerHTML=buildIntroStage(l);
  else if(currentStage===1) buildSesAvi(l);
  else if(currentStage===2) buildBalon(l);
  else if(currentStage===3) buildCiz(l);
}

// STAGE 0 — INTRO
function buildIntroStage(l){
  var words=WORDS[l]||[l+'...'];
  var emoji=EMOJIS[l]||'🌟';
  return '<div class="stage-intro">'
    +'<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">'
    +'<span class="big-letter" id="big-l" onclick="animateLetter()">'+l+'</span>'
    +'<span class="letter-small">'+l.toLowerCase()+'</span></div>'
    +'<button class="speak-btn" onclick="speakLetter()">🔊 Dinle!</button>'
    +'<div class="intro-word"><span>'+l+'</span>'+words[0].slice(1)+'<span class="word-emoji">'+emoji+'</span></div>'
    +'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
    +words.slice(1).map(w=>'<span style="background:#FFF0E8;color:#B83D00;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:800"><span style="color:var(--orange)">'+w[0]+'</span>'+w.slice(1)+'</span>').join('')
    +'</div>'
    +'<button class="next-stage-btn" onclick="nextStage(3)">Anladım! İleri →</button></div>';
}

function animateLetter(){
  var el=document.getElementById('big-l');
  if(el){el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce');}
  playLetter(currentLetter);
}

function speakLetter(){
  animateLetter();
  if(window.speechSynthesis){
    var u=new SpeechSynthesisUtterance(currentLetter);
    u.lang='tr-TR';u.rate=.8;u.pitch=1.2;
    window.speechSynthesis.speak(u);
  }
}

// STAGE 1 — SES AVI
var sesAviCorrect=0, sesAviTotal=0;
function buildSesAvi(l){
  var words=WORDS[l]||[];
  var all=[];
  LETTERS.forEach(function(x){
    if(x!==l)(WORDS[x]||[]).forEach(function(w){if(all.length<20)all.push({w,l:x});});
  });
  var correct=words.slice(0,2);
  var wrongs=shuffleArr(all).slice(0,6-correct.length);
  var items=shuffleArr([...correct.map(w=>({w,correct:true})),...wrongs.map(o=>({w:o.w,correct:false}))]).slice(0,4);
  sesAviCorrect=0;sesAviTotal=0;
  var needed=items.filter(i=>i.correct).length;

  var html='<div class="sesavi-wrap">'
    +'<div class="sesavi-q">"'+l+'" sesiyle başlayan kelimeyi bul!</div>'
    +'<div class="sesavi-hint">'+needed+' doğru cevap var · Her doğruda ⭐ kazanırsın</div>'
    +'<div class="sesavi-grid">';
  items.forEach(function(item,i){
    var emoji=EMOJIS[item.w[0]]||'🔤';
    html+='<div class="sesavi-item" id="sitem-'+i+'" onclick="checkSesAvi(this,'+item.correct+','+needed+')">'
      +'<span class="item-emoji">'+emoji+'</span>'
      +'<span class="item-word">'+item.w+'</span></div>';
  });
  html+='</div><div class="sesavi-score" id="sesavi-sc">Seçimini yap!</div></div>';
  document.getElementById('stage-area').innerHTML=html;
}

function checkSesAvi(el, correct, needed){
  if(el.classList.contains('correct')||el.classList.contains('wrong'))return;
  sesAviTotal++;
  if(correct){
    el.classList.add('correct');
    sesAviCorrect++;
    playSuccess();
    playCoin();
    sesAviTotal===1&&toast('Harika! 🌟');
    if(sesAviCorrect>=needed){
      var s=sesAviCorrect>=needed?3:sesAviCorrect>=1?2:1;
      stageStars[1]=s;
      setTimeout(()=>nextStage(s),600);
    }
  } else {
    el.classList.add('wrong');
    playWrong();
    toast('Tekrar dene! 💪');
  }
  document.getElementById('sesavi-sc').textContent=sesAviCorrect+'/'+needed+' doğru';
}

// STAGE 2 — BALON
var balonInterval=null, balonTimer=0, balonHit=0, balonMiss=0, balonTotal=0;
function buildBalon(l){
  clearInterval(balonInterval);
  balonHit=0;balonMiss=0;balonTotal=0;balonTimer=25;
  var html='<div class="balon-wrap">'
    +'<div class="balon-q">Sadece <b>'+l+'</b> harfli balonları patlat!</div>'
    +'<div class="balon-timer" id="btimer">⏱️ '+balonTimer+' saniye</div>'
    +'<div class="balon-field" id="bfield"></div>'
    +'<div class="balon-score" id="bscore">🎯 0 isabet</div></div>';
  document.getElementById('stage-area').innerHTML=html;

  balonInterval=setInterval(spawnBalon,1000);
  spawnBalon();

  var timerInt=setInterval(function(){
    balonTimer--;
    var te=document.getElementById('btimer');
    if(te) te.textContent='⏱️ '+balonTimer+' saniye';
    if(balonTimer<=0){
      clearInterval(timerInt);
      clearInterval(balonInterval);
      endBalon();
    }
  },1000);

  function spawnBalon(){
    var field=document.getElementById('bfield');
    if(!field)return;
    var isTarget=Math.random()<.45;
    var letter=isTarget?l:LETTERS.filter(x=>x!==l)[Math.floor(Math.random()*(LETTERS.length-1))];
    var col=isTarget?COLORS[Math.floor(Math.random()*4)]:['#888780','#B4B2A9','#6B6560'][Math.floor(Math.random()*3)];
    var size=52+Math.floor(Math.random()*20);
    var left=5+Math.random()*80;
    var dur=3+Math.random()*3;
    var b=document.createElement('div');
    b.className='balon';
    b.textContent=letter;
    b.style.cssText='width:'+size+'px;height:'+size+'px;background:'+col+';left:'+left+'%;font-size:'+(size/2.5)+'px;animation-duration:'+dur+'s;bottom:-60px';
    b.dataset.target=isTarget?'1':'0';
    if(isTarget)balonTotal++;
    b.onclick=function(){
      if(b.classList.contains('pop'))return;
      b.classList.add('pop');
      if(b.dataset.target==='1'){balonHit++;playSuccess();playCoin();}
      else{balonMiss++;playWrong();}
      var sc=document.getElementById('bscore');
      if(sc)sc.textContent='🎯 '+balonHit+' isabet'+(balonMiss?' · ❌ '+balonMiss:'');
      setTimeout(()=>b.remove(),350);
    };
    b.addEventListener('animationend',function(){
      if(b.dataset.target==='1'&&!b.classList.contains('pop'))balonMiss++;
      b.remove();
    });
    field.appendChild(b);
  }
}

function endBalon(){
  var pct=balonTotal>0?balonHit/balonTotal:0;
  var s=pct>=.8?3:pct>=.5?2:1;
  stageStars[2]=s;
  toast(pct>=.8?'Mükemmel! 🎉':pct>=.5?'İyi gidiyor! 💪':'Devam et! 🌟');
  setTimeout(()=>nextStage(s),800);
}

// STAGE 3 — ÇİZ
var drawing=false, drawCtx=null, strokes=0;
function buildCiz(l){
  var html='<div class="ciz-wrap">'
    +'<div class="ciz-q">'+l+' harfini çiz!</div>'
    +'<div class="canvas-wrap"><canvas id="drawCanvas" width="380" height="220"></canvas>'
    +'<svg class="ciz-guide" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">'
    +'<text x="190" y="185" font-family="serif" font-size="180" fill="#FF6B35" text-anchor="middle" opacity="0.15">'+l+'</text></svg></div>'
    +'<div class="ciz-btns"><button class="ciz-btn ciz-clear" onclick="clearCanvas()">🗑️ Temizle</button>'
    +'<button class="ciz-btn ciz-check" onclick="checkDrawing()">✅ Tamamladım!</button></div>'
    +'<div class="ciz-feedback" id="ciz-fb"></div></div>';
  document.getElementById('stage-area').innerHTML=html;

  var canvas=document.getElementById('drawCanvas');
  drawCtx=canvas.getContext('2d');
  drawCtx.strokeStyle='#FF6B35';
  drawCtx.lineWidth=6;
  drawCtx.lineCap='round';
  drawCtx.lineJoin='round';
  strokes=0;

  function getPos(e){
    var r=canvas.getBoundingClientRect();
    var scaleX=canvas.width/r.width, scaleY=canvas.height/r.height;
    var cx=e.touches?e.touches[0].clientX:e.clientX;
    var cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:(cx-r.left)*scaleX,y:(cy-r.top)*scaleY};
  }

  canvas.addEventListener('mousedown',function(e){drawing=true;var p=getPos(e);drawCtx.beginPath();drawCtx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove',function(e){if(!drawing)return;var p=getPos(e);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();});
  canvas.addEventListener('mouseup',function(){if(drawing){drawing=false;strokes++;}});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;var p=getPos(e);drawCtx.beginPath();drawCtx.moveTo(p.x,p.y);},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();if(!drawing)return;var p=getPos(e);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();},{passive:false});
  canvas.addEventListener('touchend',function(){if(drawing){drawing=false;strokes++;}});
}

function clearCanvas(){
  if(!drawCtx)return;
  var c=document.getElementById('drawCanvas');
  drawCtx.clearRect(0,0,c.width,c.height);
  strokes=0;
  document.getElementById('ciz-fb').textContent='';
}

function checkDrawing(){
  var fb=document.getElementById('ciz-fb');
  var c=document.getElementById('drawCanvas');
  if(!c){return;}
  var d=drawCtx.getImageData(0,0,c.width,c.height).data;
  var filled=0;
  for(var i=3;i<d.length;i+=4)if(d[i]>10)filled++;
  var pct=filled/(c.width*c.height);

  if(pct<.01){
    fb.textContent='✏️ Önce harfi çizmeye çalış!';
    fb.style.color='var(--red)';
    playWrong();
    return;
  }
  var s=pct>.05?3:pct>.02?2:1;
  stageStars[3]=s;
  fb.textContent=s===3?'🌟 Süper çizim!':s===2?'👍 Güzel!':'✅ Çizdin!';
  fb.style.color='var(--green)';
  playSuccess();
  setTimeout(()=>nextStage(s),900);
}

// ── STAGE GEÇİŞ ──
function nextStage(stars){
  stageStars[currentStage]=Math.max(stageStars[currentStage],stars||1);
  currentStage++;
  if(currentStage>=4){
    finishLetter();
  } else {
    renderStage();
  }
}

function finishLetter(){
  clearInterval(balonInterval);
  var total=stageStars.reduce((a,b)=>a+b,0);
  var maxStars=12;
  var earned=Math.min(3,Math.round(total/maxStars*3));
  earned=Math.max(1,earned);

  var prev=letterProgress[currentLetter]||{stars:0,done:false};
  var wasNew=!prev.done;
  if(earned>=(prev.stars||0)){
    letterProgress[currentLetter]={stars:earned,done:true};
    if(wasNew) totalStars+=earned;
    else totalStars+=Math.max(0,earned-(prev.stars||0));
  }
  document.getElementById('total-stars').textContent=totalStars;
  saveProgress();

  var area=document.getElementById('stage-area');
  var msgs=['Harika iş!','Süpersin!','Mükemmelsin!','Bravo!'];
  var msg=msgs[Math.floor(Math.random()*msgs.length)];
  area.innerHTML='<div class="result-wrap">'
    +'<div style="font-size:64px;margin-bottom:8px">'+EMOJIS[currentLetter]+'</div>'
    +'<div class="result-stars">'+'⭐'.repeat(earned)+'</div>'
    +'<div class="result-title">'+currentLetter+' Harfi Kurtarıldı!</div>'
    +'<div class="result-sub">'+msg+' '+earned+' yıldız kazandın.</div>'
    +'<div class="result-btns">'
    +'<button class="rbtn rbtn-next" onclick="nextLetterAuto()">Sonraki Harf →</button>'
    +'<button class="rbtn rbtn-map" onclick="showMap()">🗺️ Haritaya Dön</button>'
    +'<button class="rbtn rbtn-retry" onclick="startLetter(currentLetter)">🔄 Tekrar</button>'
    +'</div></div>';

  playWin();
  confetti();
  showPopup(currentLetter, msg+' '+earned+' yıldız kazandın!');
  setTimeout(closePopup, 2500);
}

function nextLetterAuto(){
  var idx=LETTERS.indexOf(currentLetter);
  if(idx<LETTERS.length-1) startLetter(LETTERS[idx+1]);
  else{toast('Tüm harfleri bitirdin! 🎉🏆');showMap();}
}

// ── KAYDET ──
function saveProgress(){
  try{
    var all=JSON.parse(localStorage.getItem(STORAGE_KEY+'_all'))||[];
    var idx=all.findIndex(x=>x.name===player.name);
    var entry={name:player.name,grade:player.grade,progress:letterProgress,stars:totalStars,date:new Date().toLocaleDateString('tr-TR')};
    if(idx>=0) all[idx]=entry; else all.push(entry);
    localStorage.setItem(STORAGE_KEY+'_all',JSON.stringify(all));
    localStorage.setItem(STORAGE_KEY,JSON.stringify(entry));
  }catch(e){}
}

function getSaved(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}
}

// ── SKORBORD ──
function showSB(){
  var all=getAllPlayers();
  all.sort((a,b)=>b.stars-a.stars);
  var medals=['🥇','🥈','🥉'];
  var list=document.getElementById('sb-list');
  if(!all.length){list.innerHTML='<div class="sb-empty">Henüz hiç kaşif yok! 🚀</div>';showScreen('screen-sb');return;}
  list.innerHTML=all.slice(0,20).map(function(p,i){
    var done=Object.values(p.progress||{}).filter(x=>x.done).length;
    return '<div class="sb-item">'
      +'<div class="sb-rank">'+(i<3?medals[i]:'#'+(i+1))+'</div>'
      +'<div class="sb-info"><div class="sb-name">'+escH(p.name)+'</div>'
      +'<div class="sb-meta">'+(p.grade?escH(p.grade)+' · ':'')+done+'/'+LETTERS.length+' harf · '+p.date+'</div></div>'
      +'<div style="text-align:right"><div class="sb-pts">'+p.stars+'⭐</div></div></div>';
  }).join('');
  showScreen('screen-sb');
}

function getAllPlayers(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY+'_all'))||[];}catch(e){return[];}
}

function clearSB(){
  if(confirm('Tüm kaşif skorları silinsin mi?')){
    localStorage.removeItem(STORAGE_KEY+'_all');
    localStorage.removeItem(STORAGE_KEY);
    showSB();
  }
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffleArr(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
</script>
